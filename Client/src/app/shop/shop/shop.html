<div class="container mt-5">
  <div class="row">
    <h1 class="main-title">Shopping</h1>
    <section class="col-md-3">
      <div class="sidebar">
        <h4 class="section-title">Sorting</h4>
        <div class="custom-select-wrapper mb-4">
          <select class="form-select" (change)="SortingByPrice($event)" [value]="SortSelected">
            @for (item of SortingOption; track $index) {
            <option [value]="item.value" >{{item.name}}</option>
            }
          </select>
        </div>
        <h4 class="section-title">Categories</h4>
        <ul class="list-group custom-list-group">
          <li
            class="list-group-item"
            style="cursor: pointer"
            [class.active]="selectedCategoryId === 0"
            (click)="selectedById(0)"
          >
            All
          </li>
          @for (item of Categories(); track item.id) {
            <li
              [class.active]="item.id == selectedCategoryId"
              (click)="selectedById(item.id)"
              class="list-group-item custom-list-item"
            >
              {{ item.name }}
            </li>
          }
        </ul>
      </div>
    </section>

    <section class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="paging-container">
          <span class="text-dark">showing 3 of 5</span>
        </div>

        <div class="search-container">
          <div class="input-group search-bar">
            <input type="text" class="form-control" placeholder="search..." />
            <input type="button" class="btn btn-danger" value="search" />
            <input type="button" class="btn btn-dark" value="Reset" />
          </div>
        </div>
      </div>
      <div class="row g-4">
        @for (item of products(); track item.id) {
          <ng-container>
            <app-shop-item class="product-item col-lg-4 col-md-6" [product]="item"></app-shop-item>
          </ng-container>
        }
      </div>
    </section>
  </div>
</div>
